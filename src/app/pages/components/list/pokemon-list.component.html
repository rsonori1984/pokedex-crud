<div class="filter-container">

  <p-selectbutton
    [options]="filterOptions"
    [ngModel]="selectedFilter"
    (ngModelChange)="onFilterChange($event)"
    optionLabel="label"
    optionValue="value">
  </p-selectbutton>

</div>

<div class="pokemon-list-container">
  <div *ngIf="service.filteredPokemons().length === 0 && !service.loading()" class="empty-state">
    <p>Nenhum Pokémon encontrado.</p>
  </div>

  <div class="pokemon-grid">
    <div *ngFor="let pokemon of service.filteredPokemons(); trackBy: trackById"
      (click)="openDetail(pokemon.name)"
      class="pokemon-card">
      <p-card header="{{ pokemon.name | titlecase }}">
        <p>#{{pokemon.details?.id}}</p>
        <p class="m-0">
<img
  [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/' + pokemon.details?.id + '.png'"
  [alt]="pokemon.name"
/>
        </p>
<app-favorite-toggle
  [pokemonName]="pokemon.name">
</app-favorite-toggle>
      </p-card>

    </div>
  </div>

  <div class="loading" *ngIf="service.loading()">
    <div class="spinner"></div>
    <p>Carregando...</p>
  </div>
</div>
