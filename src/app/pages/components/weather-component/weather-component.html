@if (weatherData) {
<div class="weather-widget">

  <span class="clock">
    ⏰ {{ clock }}
  </span>

  <span class="city">
    📍{{ weatherData.location.name }}
     - {{ weatherData.location.region }}
  </span>
  <img
    class="icon"
    [src]="'https:' + day.condition.icon"
  />

  <span class="temp">
    {{ day.avgtemp_c }}°
  </span>

  <span>
    ↑{{ day.maxtemp_c }}°
    ↓{{ day.mintemp_c }}°
  </span>

  <span>
    💧{{ day.avghumidity }}%
  </span>
</div>
} @else {
  <p>Carregando dados do clima...</p>
}
